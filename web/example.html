  </title>
</head>
<body>
  <h2>WebSocket Eaxmple</h2>
  <button id="sendBtn">Send</button>
  <div id="log"></div>
  <script>

    // 无论你是使用框架还是原生 html 按照以下内容为蓝本编写交互脚本即可

    // websocket connection
    let socket = new WebSocket("ws://localhost:3000/ws");
    socket.onopen = function() {
      log("✅ 已连接到 WebSocket 服务");
    };
    socket.onmessage = function(event) {
      let data = JSON.parse(event.data)
      log(data.content);
    };
    socket.onclose = function() {
      log("\n ❌ 连接已关闭");
    };
    socket.onerror = function(error) {
      log("\n ⚠️ 出错: " + error);
      // 如果是无关紧要的出错(如网络) 重连可以解决问题 服务器仅维护一个 socket 对象 不支持多个连接 如果需要可以自己改写
      socket = new WebSocket("ws://localhost:3000/ws");
    };

    // output
    function log(msg) {
      const div = document.getElementById("log");
      div.innerText += msg;
    }

    // input
    document.getElementById("sendBtn").onclick = function() {
      if (socket && socket.readyState === WebSocket.OPEN) {

        /**
         * @typedef {Object} User
         * @property {string} type 输入类型, 见 ./websocket/consts.go 中的 // Input Type 网页端目前仅需使用 user_input
         * @property {string} content 输入内容
         */
        socket.send(JSON.stringify({
            type: 'user_input',
            content: "请调用一下命令行 随便等待一下用户输入或者执行一些内容 使用交互式执行"
        }));
        log("\n ➡️ 已发送: Hello Server");
      } else {
        log("\n ⚠️ 连接未建立，无法发送");
      }
    };
  </script>
</body>
</html>
