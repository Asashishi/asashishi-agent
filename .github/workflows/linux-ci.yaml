name: Asashishi Agent Linux CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  linux-build-and-test:
    runs-on: ubuntu-latest

    
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with: 
          go-version: '1.25.5'

      - name: get libs
        run: go mod download

      - name: build
        run: go build -ldflags="-s -w" -trimpath -o asashishi-agent

      - name: test
        run: ./run-test.sh