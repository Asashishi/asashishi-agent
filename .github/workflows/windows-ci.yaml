name: Asashishi-Agent CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with: 
          go-version: '1.22'

      - name: get libs
        run: go mod download

      - name: build
        run: go build -ldflags="-s -w" -trimpath -o asashishi-agent.exe

      - name: run process
        run: .\asashishi-agent.exe
